<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h2>회원가입</h2>
    <form id="signupForm">
      <div class="form-group">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required>
      </div>
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="이메일을 입력하세요" required>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
      </div>
      <div class="form-group">
        <label for="role">역할</label>
        <select id="role" name="role" onchange="toggleLicenseField()" required>
          <option value="">역할을 선택하세요</option>
          <option value="optician">안경사</option>
          <option value="customer">일반인</option>
        </select>
      </div>
      <div class="form-group" id="license-group">
        <label for="license">면허번호</label>
        <input type="text" id="license" name="license" placeholder="안경사 면허번호를 입력하세요">
      </div>
      <div class="button-group">
        <button type="submit">회원가입</button>
      </div>
    </form>
    <a href="/" class="back-link">메인 페이지로 돌아가기</a>
  </div>

  <script>
    function toggleLicenseField() {
      const role = document.getElementById('role').value;
      const licenseGroup = document.getElementById('license-group');
      if (role === 'optician') {
        licenseGroup.style.display = 'block';
        document.getElementById('license').required = true;
      } else {
        licenseGroup.style.display = 'none';
        document.getElementById('license').required = false;
      }
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value,
        license: document.getElementById('license').value
      };

      try {
        const response = await fetch('/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();
        if (data.success) {
          // 사용자 정보를 localStorage에 저장
          localStorage.setItem('user', JSON.stringify(data.user));
          // 메인 페이지로 이동
          window.location.href = '/main';
        } else {
          alert(data.message || '회원가입에 실패했습니다.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('서버 오류가 발생했습니다.');
      }
    });
  </script>
</body>
</html>
