<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      padding: 2.5rem;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 2rem;
      text-align: center;
      font-size: 1.8rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #34495e;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
      height: 45px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 1rem;
    }

    button {
      flex: 1;
      padding: 12px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      height: 45px;
    }

    button:hover {
      background: #2980b9;
      transform: translateY(-2px);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #7f8c8d;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: #3498db;
    }

    #license-group {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>회원가입</h2>
    <form id="signupForm">
      <div class="form-group">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required>
      </div>
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="이메일을 입력하세요" required>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
      </div>
      <div class="form-group">
        <label for="role">역할</label>
        <select id="role" name="role" onchange="toggleLicenseField()" required>
          <option value="">역할을 선택하세요</option>
          <option value="optician">안경사</option>
          <option value="customer">일반인</option>
        </select>
      </div>
      <div class="form-group" id="license-group">
        <label for="license">면허번호</label>
        <input type="text" id="license" name="license" placeholder="안경사 면허번호를 입력하세요">
      </div>
      <div class="button-group">
        <button type="submit">회원가입</button>
      </div>
    </form>
    <a href="/" class="back-link">메인 페이지로 돌아가기</a>
  </div>

  <script>
    function toggleLicenseField() {
      const role = document.getElementById('role').value;
      const licenseGroup = document.getElementById('license-group');
      if (role === 'optician') {
        licenseGroup.style.display = 'block';
        document.getElementById('license').required = true;
      } else {
        licenseGroup.style.display = 'none';
        document.getElementById('license').required = false;
      }
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value,
        license: document.getElementById('license').value
      };

      try {
        const response = await fetch('/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();
        if (data.success) {
          alert(data.message);
          window.location.href = '/';
        } else {
          alert('회원가입에 실패했습니다.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('서버 오류가 발생했습니다.');
      }
    });
  </script>
</body>
</html>
