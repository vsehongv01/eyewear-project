<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>안경Lab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      padding: 2.5rem;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 2.5rem;
      font-size: 1.8rem;
    }

    .input-group {
      margin-bottom: 1.2rem;
      position: relative;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
      height: 45px;
    }

    input:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    input::placeholder {
      color: #95a5a6;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 0.5rem;
    }

    .login-btn {
      flex: 1;
      padding: 12px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      height: 45px;
    }

    .login-btn:hover {
      background: #2980b9;
      transform: translateY(-2px);
    }

    .signup-btn {
      flex: 1;
      padding: 12px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      height: 45px;
    }

    .signup-btn:hover {
      background: #27ae60;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>들어가기</h2>
    <div class="input-group">
      <input type="text" id="email" name="email" placeholder="이메일을 입력하세요">
    </div>
    <div class="input-group">
      <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요">
    </div>
    <div class="button-group">
      <button class="login-btn" onclick="login()">로그인</button>
      <button class="signup-btn" onclick="location.href='/signup'">회원가입</button>
    </div>
  </div>

  <script>
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (data.success) {
          alert(data.message);
          // 로그인 성공 후 처리
        } else {
          alert('로그인에 실패했습니다.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('서버 오류가 발생했습니다.');
      }
    }
  </script>
</body>
</html>
