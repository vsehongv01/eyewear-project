<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>렌즈 여벌 도수 시각화</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 20px;
      margin: 0;
    }
    h2 {
      text-align: center;
    }
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    #lens-select {
      margin-left: 10px;
    }
    #lens-search-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    #lens-search-bar {
      margin-bottom: 5px;
    }
    #lens-dropdown {
      display: none;
      width: 250px;
      margin-left: 10px;
    }
    #search-result-wrapper {
      display: flex;
      align-items: center;
    }
    .table-container {
      overflow-x: auto;
      overflow-y: auto;
      margin: 20px auto;
      max-width: 900px;
      max-height: 600px;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.05);
      background: white;
    }
    table {
      border-collapse: collapse;
      font-size: 11px;
      width: auto;
      margin: 0 auto;
    }
    th, td {
      border: 1px solid #ddd;
      text-align: center;
      width: 36px;
      height: 24px;
    }
    th {
      background-color: #f0f0f0;
    }
    .highlight {
      background-color: #a3d5ff;
    }
    .no-astigmatism {
      background-color: #ffe3a3;
    }
    @media (max-width: 768px) {
      table {
        font-size: 10px;
      }
      th, td {
        width: 30px;
        height: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 1000px;">
    <h2 id="lens-title" style="margin-bottom: 2.5rem; font-size:2rem; text-align:center;">렌즈 여벌 도수 시각화</h2>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 24px;">
      <div style="flex:1; min-width:220px; display: flex; align-items: center; gap: 10px;">
        <label for="lens-select" style="margin-bottom:0;"><strong>렌즈 종류:</strong></label>
        <select id="lens-select" class="lens-select"></select>
      </div>
      <div style="flex:1; min-width:320px; text-align:right; display: flex; flex-direction: column; align-items: flex-end;">
        <div id="lens-search-bar" style="margin-bottom: 7px; display: flex; align-items: center; gap: 6px;">
          SPH: <input type="number" id="input-sph" step="0.25" class="small-input" inputmode="decimal" pattern="^-?\\d+(\\.\\d{1,2})?$">
          CYL: <input type="number" id="input-cyl" step="0.25" class="small-input" inputmode="decimal" pattern="^-?\\d+(\\.\\d{1,2})?$">
          <button class="small-btn" onclick="searchLensByPower()">검색</button>
        </div>
        <div id="search-result-wrapper" style="margin-top: 2px; text-align: right; display: flex; flex-direction: row; align-items: center; justify-content: flex-end; gap: 8px;">
          <label for="lens-dropdown" style="font-size:0.97rem; color:var(--text-sub);">검색 결과:</label>
          <select id="lens-dropdown" onchange="selectFromDropdown(this)" class="result-dropdown"></select>
        </div>
      </div>
    </div>
    <div class="table-container">
      <table id="lens-table">
        <thead>
          <tr><th>SPH\CYL</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    let lensData = [];

    async function fetchLensData() {
      const response = await fetch('/api/lens-data');
      const raw = await response.json();
      lensData = raw.map(lens => {
        const clean = {};
        for (const [k, v] of Object.entries(lens)) {
          clean[k.replace(/"/g, '').trim()] = v.replace(/"/g, '').trim();
        }
        return clean;
      });

      populateLensSelector(lensData);
    }

    function clean(val) {
      return parseFloat((val ?? '').trim()) || 0;
    }

    function populateLensSelector(data) {
      const select = document.getElementById('lens-select');
      const seen = new Set();
      data.forEach(lens => {
        const label = `${lens['브랜드']} ${lens['렌즈 종류']} ${lens['굴절률']} ${lens['코팅']}`;
        if (!seen.has(label)) {
          const opt = document.createElement('option');
          opt.value = label;
          opt.textContent = label;
          select.appendChild(opt);
          seen.add(label);
        }
      });
      select.addEventListener('change', () => {
        const sel = select.value;
        const target = data.find(lens => `${lens['브랜드']} ${lens['렌즈 종류']} ${lens['굴절률']} ${lens['코팅']}` === sel);
        if (target) renderTable(target);
      });
      select.dispatchEvent(new Event('change'));
    }

    function updateDropdown(results) {
      const dropdown = document.getElementById('lens-dropdown');
      dropdown.innerHTML = '';
      if (results.length > 0) {
        dropdown.style.display = 'block';
        results.forEach(lens => {
          const label = `${lens['브랜드']} ${lens['렌즈 종류']} ${lens['굴절률']} ${lens['코팅']}`;
          const option = document.createElement('option');
          option.value = label;
          option.textContent = label;
          dropdown.appendChild(option);
        });
      } else {
        dropdown.style.display = 'none';
      }
    }

    function selectFromDropdown(selectEl) {
      const selectedLabel = selectEl.value;
      const selectedLens = lensData.find(lens => {
        const label = `${lens['브랜드']} ${lens['렌즈 종류']} ${lens['굴절률']} ${lens['코팅']}`;
        return label === selectedLabel;
      });
      if (selectedLens) renderTable(selectedLens);
    }

    function searchLensByPower() {
      let sph = parseFloat(document.getElementById('input-sph').value);
      let cyl = parseFloat(document.getElementById('input-cyl').value);
      if (cyl > 0) {
        sph = sph + cyl;
        cyl = -cyl;
      }
      const results = lensData.filter(lens => {
        const sStart = parseFloat(lens['구면 도수 시작 범위 (S)']) || 0;
        const sEnd = parseFloat(lens['구면 도수 끝 범위 (S)']) || 0;
        const cHyper = parseFloat(lens['원시 난시 도수 범위 (C)']) || 0;
        const cMyop = parseFloat(lens['근시 난시 도수 범위 (C)']) || 0;
        const sumLimit = parseFloat(lens['합도수']) || null;

        const isHyper = sph > 0 && sph <= sStart && cyl >= cHyper && cyl <= 0;
        const isMyop = sph <= 0 && sph <= sStart && sph >= sEnd && cyl >= cMyop && cyl <= 0;
        const isSumOk = sumLimit !== null ? (sph + cyl >= sumLimit) : true;

        return (isHyper || isMyop) && isSumOk;
      });

      updateDropdown(results);
    }

    function renderTable(lens) {
      const table = document.getElementById("lens-table");
      const headerRow = table.querySelector("thead tr");
      const tbody = table.querySelector("tbody");
      headerRow.innerHTML = '<th>SPH\\CYL</th>';
      tbody.innerHTML = '';

      const cylValues = Array.from({ length: 33 }, (_, i) => (0 - i * 0.25).toFixed(2));
      const sphValues = Array.from({ length: 161 }, (_, i) => (20 - i * 0.25).toFixed(2));

      const sStart = clean(lens['구면 도수 시작 범위 (S)']);
      const sEnd = clean(lens['구면 도수 끝 범위 (S)']);
      const cHyperopia = clean(lens['원시 난시 도수 범위 (C)']);
      const cMyopia = clean(lens['근시 난시 도수 범위 (C)']);
      const noAstigStart = lens['난시없는 근시도수 시작'] ? clean(lens['난시없는 근시도수 시작']) : null;
      const noAstigEnd = lens['난시없는 근시도수 끝'] ? clean(lens['난시없는 근시도수 끝']) : null;
      const sumPowerLimit = lens['합도수'] ? clean(lens['합도수']) : null;

      // 검색 입력값 가져오기
      let searchSph = parseFloat(document.getElementById('input-sph').value);
      let searchCyl = parseFloat(document.getElementById('input-cyl').value);
      if (searchCyl > 0) {
        searchSph = searchSph + searchCyl;
        searchCyl = -searchCyl;
      }
      searchSph = searchSph?.toFixed(2);
      searchCyl = searchCyl?.toFixed(2);

      document.getElementById("lens-title").textContent = `${lens['브랜드']} ${lens['렌즈 종류']} ${lens['굴절률']} ${lens['코팅']} 도수범위`;

      let visibleCylIndices = new Set();
      const dataRows = [];

      sphValues.forEach(sph => {
        const row = [];
        const sphNum = parseFloat(sph);
        let hasVisibleCell = false;

        cylValues.forEach((cyl, idx) => {
          const cylNum = parseFloat(cyl);
          const sumPower = sphNum + cylNum;
          const passesSumPower = sumPowerLimit !== null ? sumPower >= sumPowerLimit : true;

          if (sphNum > 0 && sphNum <= sStart && cylNum >= cHyperopia && cylNum <= 0 && passesSumPower) {
            row[idx] = 'highlight';
            visibleCylIndices.add(idx);
            hasVisibleCell = true;
          } else if (sphNum <= 0 && sphNum <= sStart && sphNum >= sEnd && cylNum >= cMyopia && cylNum <= 0 && passesSumPower) {
            row[idx] = 'highlight';
            visibleCylIndices.add(idx);
            hasVisibleCell = true;
          } else if (noAstigStart !== null && noAstigEnd !== null && sphNum >= noAstigEnd && sphNum <= noAstigStart && cylNum === 0) {
            row[idx] = 'no-astigmatism';
            visibleCylIndices.add(idx);
            hasVisibleCell = true;
          } else {
            row[idx] = '';
          }
        });

        if (hasVisibleCell) {
          dataRows.push({ sph, row });
        }
      });

      cylValues.forEach((cyl, idx) => {
        if (visibleCylIndices.has(idx)) {
          const th = document.createElement("th");
          th.textContent = parseFloat(cyl).toFixed(2);
          headerRow.appendChild(th);
        }
      });

      dataRows.forEach(({ sph, row }) => {
        const tr = document.createElement("tr");
        const th = document.createElement("th");
        const sphFormatted = parseFloat(sph) > 0 ? `+${parseFloat(sph).toFixed(2)}` : parseFloat(sph).toFixed(2);
        th.textContent = sphFormatted;
        tr.appendChild(th);

        row.forEach((cell, idx) => {
          if (visibleCylIndices.has(idx)) {
            const td = document.createElement("td");
            if (cell) td.className = cell;
            // 검색한 도수에 해당하는 셀에 빨간 테두리
            if (sph === searchSph && cylValues[idx] === searchCyl) {
              td.classList.add('highlight-search');
            }
            tr.appendChild(td);
          }
        });

        tbody.appendChild(tr);
      });
    }

    fetchLensData();
  </script>
</body>
</html>
